<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALOOOO222AAAAA</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf6ff;
      color: #233;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #087e8b;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 0 4px 15px #0002;
      animation: appear 1s ease-out;
    }

    button {
      background: #087e8b;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: #075c66;
      transform: scale(1.08);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ANA BA7EEEB 7AMMOO GOZZZYYY</h1>
    <p>LUKAAA ELMALOOOKAAAA.</p>
    <button>YARAAAAB ASHTAGHAL</button>
  </div>
</body>
</html>
